<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Mgitok git authentication">
  <title>Mgitok</title>
  <!-- 原创造型：一个终端窗口，里面嵌一把钥匙的齿形。
       终端 = git 命令行；钥匙的圆形握柄 + 两枚齿 = 凭据托管。
       窗口右上角的圆点对应「已接管 / 在线」的状态灯。 -->
  <rect x="2" y="4" width="28" height="24" rx="5" fill="#24292F"/>
  <rect x="2" y="4" width="28" height="24" rx="5" fill="none" stroke="#57606A" stroke-width="1.2"/>
  <!-- 钥匙握柄 -->
  <circle cx="14" cy="14" r="4.6" fill="none" stroke="#3FB950" stroke-width="2.2"/>
  <!-- 钥匙杆 -->
  <path d="M18.2 14h7.4" stroke="#3FB950" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 两枚齿 -->
  <path d="M22.2 14v3.4M25.4 14v2.2" stroke="#3FB950" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 状态灯 -->
  <circle cx="25.2" cy="8.4" r="1.5" fill="#58A6FF"/>
  <!-- 终端提示符 -->
  <path d="M7.6 23.2l2.2 1.8-2.2 1.8" fill="none" stroke="#8B949E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11.6 26.8h3" stroke="#8B949E" stroke-width="1.4" stroke-linecap="round"/>
</svg>
